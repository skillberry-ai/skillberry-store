name: pull_request

on:
  pull_request:
    branches: [ main ]

jobs:
  pull_request:
    name: pull-request
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v6.3.0
      with:
        python-version: "3.11"
    - name: install make
      run: sudo apt-get install make
    - name: checkout
      uses: actions/checkout@v7.0.0
    - name: create-venv
      run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
    - name: pull-docker-image
      # Mirror of python:3.11 hosted on the org GHCR. AWS ECR Public throttles
      # anonymous pulls per source IP; GitHub's shared runner IPs blow through
      # that limit and fail this step with "toomanyrequests". GHCR public pulls
      # are not subject to that anonymous limit. See issue #249.
      run: docker pull ghcr.io/skillberry-ai/python:3.11
    - name: run-make
      run: |
          source .venv/bin/activate
          make ci-pull-request

  # Core must work, and stay free of rossoctl knowledge, with NO plugins
  # installed (docs/design/rossoctl-skills.md §5.1, §8). `make test` installs
  # plugins-all, so this job installs only [dev,pytest]. The first run below
  # includes tests/test_core_has_no_rossoctl.py.
  core-without-plugins:
    name: core-without-plugins
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v6.3.0
      with:
        python-version: "3.11"
    - name: checkout
      uses: actions/checkout@v7.0.0
    - name: install core only
      run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip uv
          uv pip install -e ".[dev,pytest]"
    - name: core tests (no plugins)
      env:
        EXECUTE_PYTHON_LOCALLY: "true"
      run: |
          source .venv/bin/activate
          pytest src/skillberry_store/tests -m "not integration" \
            --ignore=src/skillberry_store/tests/e2e \
            --deselect src/skillberry_store/tests/fast_api/test_plugin_access_control.py

